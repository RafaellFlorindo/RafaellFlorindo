teName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.667;1" dur="1.80s"/><line x1="828" y1="100" x2="828" y2="260" stroke="#E4E4E7"/><text x="860.0" y="116.0" class="m" font-size="11" font-weight="500" fill="#52525B" text-anchor="start" letter-spacing="1.2">MEAN COMPLETION TIME</text><text x="856" y="180" font-size="66" font-weight="800" fill="#EA580C" letter-spacing="-3">−55.8<tspan font-size="36">%</tspan></text><text x="860.0" y="210.0" class="m" font-size="13" font-weight="500" fill="#18181B" text-anchor="start" letter-spacing="0">p = 0.0017 · n = 35 + 35</text><text x="860.0" y="242.0" class="m" font-size="13" font-weight="400" fill="#52525B" text-anchor="start" letter-spacing="0">Functional tests: +7 p.p.</text><text x="860.0" y="262.0" class="m" font-size="13" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">not statistically significant</text></g>
