<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="196" viewBox="0 0 1200 196" role="img" aria-label="How I work: Context (Obsidian second brain that agents read and keep up to date.) → Orchestrate (A lead agent splits the work; specialists take front, back and tests.) → Implement (Claude Code + Codex CLI on real repos, with atomic, reviewable commits.) → Verify (Cross-model audits, Playwright E2E, security sweeps, DB rehearsals.) → Guardrails (Manual → approve → auto, always with caps. Never unsupervised by default.)">
