m" type="translate" values="0 10;0 10;0 0" keyTimes="0;0.667;1" dur="1.80s"/><line x1="830" y1="96" x2="830" y2="260" stroke="#23271F"/><text x="860" y="112" class="m" font-size="11" font-weight="500" fill="#8A8F84" text-anchor="start" letter-spacing="1.2">MEAN COMPLETION TIME</text><text x="856" y="176" font-size="64" font-weight="800" fill="#CCFF4D" letter-spacing="-3">−55.8<tspan font-size="36">%</tspan></text><text x="860" y="206" class="m" font-size="13" font-weight="500" fill="#ECEEE6" text-anchor="start" letter-spacing="0">p = 0.0017 · n = 35 + 35</text><text x="860" y="240" class="m" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">Functional tests: +7 p.p.</text><text x="860" y="260" class="m" font-size="13" font-weight="400" fill="#FFB547" text-anchor="start" letter-spacing="0">not statistically significant</text></g>
