<defs></defs>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.143;1" dur="0.70s"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.143;1" dur="0.70s"/><rect x="0.5" y="0.5" width="287.0" height="199.0" rx="14" fill="#121215" stroke="#232329"/><rect x="20.0" y="20" width="48" height="48" rx="12" fill="#18181C" stroke="#30303A"/><circle cx="44.0" cy="44" r="12" fill="none" stroke="#FF6B35" stroke-width="2"/><circle cx="44.0" cy="44" r="4.5" fill="#FF6B35"/><text x="268.0" y="40.0" class="m" font-size="11" font-weight="400" fill="#5C5C66" text-anchor="end" letter-spacing="0">01</text><text x="22.0" y="104.0" class="m" font-size="14" font-weight="700" fill="#F4F4F5" text-anchor="start" letter-spacing="1">AI AGENTS</text><text x="22.0" y="136.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">Qualify, answer, route and book —</text><text x="22.0" y="157.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">with guardrails and human handoff.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.268;1" dur="0.82s"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.268;1" dur="0.82s"/><rect x="304.5" y="0.5" width="287.0" height="199.0" rx="14" fill="#121215" stroke="#232329"/><rect x="324.0" y="20" width="48" height="48" rx="12" fill="#18181C" stroke="#30303A"/><rect x="335.0" y="31" width="26" height="26" rx="5" fill="none" stroke="#FF6B35" stroke-width="2"/><path d="M335.0 40H361.0M344.0 40V57" stroke="#FF6B35" stroke-width="2"/><text x="572.0" y="40.0" class="m" font-size="11" font-weight="400" fill="#5C5C66" text-anchor="end" letter-spacing="0">02</text><text x="326.0" y="104.0" class="m" font-size="14" font-weight="700" fill="#F4F4F5" text-anchor="start" letter-spacing="1">CRM ARCHITECTURE</text><text x="326.0" y="136.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">GoHighLevel snapshots, pipelines</text><text x="326.0" y="157.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">and white-label setups at scale.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.362;1" dur="0.94s"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.362;1" dur="0.94s"/><rect x="608.5" y="0.5" width="287.0" height="199.0" rx="14" fill="#121215" stroke="#232329"/><rect x="628.0" y="20" width="48" height="48" rx="12" fill="#18181C" stroke="#30303A"/><path d="M638.0 44H647.0M657.0 44H666.0" stroke="#FF6B35" stroke-width="2"/><circle cx="652.0" cy="44" r="5" fill="none" stroke="#FF6B35" stroke-width="2"/><circle cx="640.0" cy="44" r="2.5" fill="#FF6B35"/><circle cx="664.0" cy="44" r="2.5" fill="#FF6B35"/><text x="876.0" y="40.0" class="m" font-size="11" font-weight="400" fill="#5C5C66" text-anchor="end" letter-spacing="0">03</text><text x="630.0" y="104.0" class="m" font-size="14" font-weight="700" fill="#F4F4F5" text-anchor="start" letter-spacing="1">INTEGRATIONS</text><text x="630.0" y="136.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">APIs, webhooks and n8n flows with</text><text x="630.0" y="157.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">retries and idempotency built in.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.434;1" dur="1.06s"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.434;1" dur="1.06s"/><rect x="912.5" y="0.5" width="287.0" height="199.0" rx="14" fill="#121215" stroke="#232329"/><rect x="932.0" y="20" width="48" height="48" rx="12" fill="#18181C" stroke="#30303A"/><path d="M950.0 34L943.0 44L950.0 54M962.0 34L969.0 44L962.0 54" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1180.0" y="40.0" class="m" font-size="11" font-weight="400" fill="#5C5C66" text-anchor="end" letter-spacing="0">04</text><text x="934.0" y="104.0" class="m" font-size="14" font-weight="700" fill="#F4F4F5" text-anchor="start" letter-spacing="1">PRODUCT ENGINEERING</text><text x="934.0" y="136.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">TypeScript, Python, Postgres,</text><text x="934.0" y="157.0" font-size="13.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">workers and tests — tools and SaaS.</text></g>
