<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="End of transmission — thanks for stopping by">
<title>End of transmission — thanks for stopping by</title>
<style>
  text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs></defs>
<line x1="0" y1="40" x2="1200" y2="40" stroke="#23271F"/><rect x="0" y="39" width="140" height="2" fill="#CCFF4D"><animate attributeName="x" from="-140" to="1200" dur="5s" repeatCount="indefinite"/></rect><text x="600.0" y="82" class="m" font-size="12" font-weight="500" fill="#8A8F84" text-anchor="middle" letter-spacing="4">END OF TRANSMISSION</text><rect x="704.0" y="71" width="8" height="13" fill="#CCFF4D" class="pulse"/><text x="600.0" y="106" class="m" font-size="12" font-weight="400" fill="#4A4F45" text-anchor="middle" letter-spacing="1">thanks for stopping by</text>
</svg>
