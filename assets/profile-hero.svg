<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Rafael Florindo — Automation and AI Engineer</title>
  <desc>Dark professional banner with purple and cyan accents representing connected AI, automation, CRM, API, and SaaS systems.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B12"/>
      <stop offset="0.52" stop-color="#0D111B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="100" y1="80" x2="660" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="lineAccent" x1="760" y1="60" x2="1120" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 105) rotate(90) scale(250)">
      <stop stop-color="#7C3AED" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 330) rotate(90) scale(180)">
      <stop stop-color="#0891B2" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#purpleGlow)"/>
    <rect width="1200" height="420" fill="url(#cyanGlow)"/>

    <path d="M0 418H1200" stroke="url(#accent)" stroke-width="3"/>
    <path d="M0 2H1200" stroke="#FFFFFF" stroke-opacity="0.05"/>

    <g opacity="0.82">
      <path d="M745 104L848 72L946 128L1050 80L1138 134" stroke="url(#lineAccent)" stroke-width="2"/>
      <path d="M745 104L801 200L910 181L1002 239L1138 197" stroke="url(#lineAccent)" stroke-width="2"/>
      <path d="M801 200L765 312L896 340L1002 239L1094 326" stroke="url(#lineAccent)" stroke-width="2"/>
      <path d="M946 128L910 181L1002 239L1050 80" stroke="url(#lineAccent)" stroke-width="2" opacity="0.55"/>
      <path d="M1138 134L1138 197L1094 326" stroke="url(#lineAccent)" stroke-width="2" opacity="0.55"/>
    </g>

    <g filter="url(#softGlow)">
      <circle cx="745" cy="104" r="7" fill="#A78BFA"/>
      <circle cx="848" cy="72" r="5" fill="#8B5CF6"/>
      <circle cx="946" cy="128" r="9" fill="#6366F1"/>
      <circle cx="1050" cy="80" r="6" fill="#22D3EE"/>
      <circle cx="1138" cy="134" r="5" fill="#67E8F9"/>
      <circle cx="801" cy="200" r="8" fill="#8B5CF6"/>
      <circle cx="910" cy="181" r="5" fill="#818CF8"/>
      <circle cx="1002" cy="239" r="10" fill="#22D3EE"/>
      <circle cx="1138" cy="197" r="7" fill="#67E8F9"/>
      <circle cx="765" cy="312" r="5" fill="#A78BFA"/>
      <circle cx="896" cy="340" r="8" fill="#6366F1"/>
      <circle cx="1094" cy="326" r="9" fill="#22D3EE"/>
    </g>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <rect x="70" y="70" width="236" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.42"/>
      <circle cx="91" cy="87" r="4" fill="#22D3EE"/>
      <text x="106" y="92" fill="#C4B5FD" font-size="13" font-weight="700" letter-spacing="2.1">SYSTEMS THAT OPERATE</text>

      <text x="70" y="182" fill="#F8FAFC" font-size="62" font-weight="760" letter-spacing="-2.4">Rafael Florindo</text>
      <text x="70" y="229" fill="url(#accent)" font-size="28" font-weight="650">Automation &amp; AI Engineer</text>

      <text x="70" y="283" fill="#CBD5E1" font-size="18" font-weight="450">AI Agents  ·  Business Automation  ·  CRM Architecture</text>
      <text x="70" y="313" fill="#94A3B8" font-size="18" font-weight="450">APIs  ·  SaaS  ·  Production Engineering</text>

      <rect x="70" y="351" width="72" height="3" rx="1.5" fill="#8B5CF6"/>
      <rect x="148" y="351" width="42" height="3" rx="1.5" fill="#6366F1"/>
      <rect x="196" y="351" width="24" height="3" rx="1.5" fill="#22D3EE"/>

      <g fill="#94A3B8" font-size="11" font-weight="650" letter-spacing="1.2">
        <text x="721" y="387">AI</text>
        <text x="791" y="387">AUTOMATION</text>
        <text x="900" y="387">CRM</text>
        <text x="960" y="387">APIs</text>
        <text x="1021" y="387">SAAS</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
