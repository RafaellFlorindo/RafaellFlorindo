<svg xmlns="http://www.w3.org/2000/svg" width="592" height="300" viewBox="0 0 592 300" role="img" aria-label="HTC Ops — Customer-success cockpit for High Ticket Club: every 15 minutes Claude drafts member messages and call scripts into today&#x27;s queue.">
<title>HTC Ops — Customer-success cockpit for High Ticket Club: every 15 minutes Claude drafts member messages and call scripts into today&#x27;s queue.</title>
<style>
  text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
