="start" letter-spacing="0">Meet transcripts summarized into GoHighLevel notes</text><rect x="24" y="221" width="6" height="6" fill="#CCFF4D"/><text x="40" y="230" class="m" font-size="13" font-weight="400" fill="#ECEEE6" text-anchor="start" letter-spacing="0">GHL OAuth through an n8n broker · Slack tickets</text><rect x="24" y="256" width="69" height="22" rx="4" fill="#161915" stroke="#23271F"/><text x="58.5" y="271" class="m" font-size="10" font-weight="500" fill="#8A8F84" text-anchor="middle" letter-spacing="0.5">NEXT.JS</text><rect x="99" y="256" width="97" height="22" rx="4" fill="#161915" stroke="#23271F"/><text x="147.5" y="271" class="m" font-size="10" font-weight="500" fill="#8A8F84" text-anchor="middle" letter-spacing="0.5">GOHIGHLEVEL</text><rect x="202" y="256" width="41" height="22" rx="4" fill="#161915" stroke="#23271F"/><text x="222.5" y="271" class="m" font-size="10" font-weight="500" fill="#8A8F84" text-anchor="middle" letter-spacing="0.5">N8N</text><rect x="249" y="256" width="62" height="22" rx="4" fill="#161915" stroke="#23271F"/><text x="280.0" y="271" class="m" font-size="10" font-weight="500" fill="#8A8F84" text-anchor="middle" letter-spacing="0.5">CLAUDE</text></g>
