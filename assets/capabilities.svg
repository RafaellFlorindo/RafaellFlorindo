<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.143;1" dur="0.70s"/><animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0" keyTimes="0;0.143;1" dur="0.70s"/><rect x="0.5" y=".5" width="287.0" height="195" rx="12" fill="#111311" stroke="#23271F"/><circle cx="34.0" cy="36" r="11" fill="none" stroke="#CCFF4D" stroke-width="2"/><circle cx="34.0" cy="36" r="4" fill="#CCFF4D"/><text x="268.0" y="40" class="m" font-size="11" font-weight="400" fill="#4A4F45" text-anchor="end" letter-spacing="0">01</text><text x="22.0" y="92" class="m" font-size="15" font-weight="700" fill="#ECEEE6" text-anchor="start" letter-spacing="1">AI AGENTS</text><text x="22.0" y="124" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">Qualify, answer, route and book —</text><text x="22.0" y="144" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">with guardrails and human handoff.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.268;1" dur="0.82s"/><animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0" keyTimes="0;0.268;1" dur="0.82s"/><rect x="304.5" y=".5" width="287.0" height="195" rx="12" fill="#111311" stroke="#23271F"/><rect x="326.0" y="24" width="24" height="24" rx="3" fill="none" stroke="#CCFF4D" stroke-width="2"/><path d="M326.0 33H350.0M335.0 33V48" stroke="#CCFF4D" stroke-width="2"/><text x="572.0" y="40" class="m" font-size="11" font-weight="400" fill="#4A4F45" text-anchor="end" letter-spacing="0">02</text><text x="326.0" y="92" class="m" font-size="15" font-weight="700" fill="#ECEEE6" text-anchor="start" letter-spacing="1">CRM ARCHITECTURE</text><text x="326.0" y="124" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">GoHighLevel snapshots, pipelines and</text><text x="326.0" y="144" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">white-label setups that hold at scale.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.362;1" dur="0.94s"/><animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0" keyTimes="0;0.362;1" dur="0.94s"/><rect x="608.5" y=".5" width="287.0" height="195" rx="12" fill="#111311" stroke="#23271F"/><path d="M630.0 36H638.0M646.0 36H654.0" stroke="#CCFF4D" stroke-width="2"/><circle cx="642.0" cy="36" r="4" fill="none" stroke="#CCFF4D" stroke-width="2"/><circle cx="632.0" cy="36" r="2" fill="#CCFF4D"/><circle cx="652.0" cy="36" r="2" fill="#CCFF4D"/><text x="876.0" y="40" class="m" font-size="11" font-weight="400" fill="#4A4F45" text-anchor="end" letter-spacing="0">03</text><text x="630.0" y="92" class="m" font-size="15" font-weight="700" fill="#ECEEE6" text-anchor="start" letter-spacing="1">INTEGRATIONS</text><text x="630.0" y="124" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">APIs, webhooks and n8n flows with</text><text x="630.0" y="144" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">retries and idempotency built in.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.434;1" dur="1.06s"/><animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0" keyTimes="0;0.434;1" dur="1.06s"/><rect x="912.5" y=".5" width="287.0" height="195" rx="12" fill="#111311" stroke="#23271F"/><path d="M941.0 28L934.0 36L941.0 44M951.0 28L958.0 36L951.0 44" fill="none" stroke="#CCFF4D" stroke-width="2"/><text x="1180.0" y="40" class="m" font-size="11" font-weight="400" fill="#4A4F45" text-anchor="end" letter-spacing="0">04</text><text x="934.0" y="92" class="m" font-size="15" font-weight="700" fill="#ECEEE6" text-anchor="start" letter-spacing="1">PRODUCT ENGINEERING</text><text x="934.0" y="124" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">TypeScript, Python, Postgres, workers</text><text x="934.0" y="144" font-size="13" font-weight="400" fill="#8A8F84" text-anchor="start" letter-spacing="0">and tests — internal tools and SaaS.</text></g>
