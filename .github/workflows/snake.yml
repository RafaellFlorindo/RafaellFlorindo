name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#3F6212&color_dots=#ebedf0,#d9f99d,#bef264,#84cc16,#4d7c0f
            dist/snake-dark.svg?palette=github-dark&color_snake=#CCFF4D&color_dots=#161b22,#2a3311,#4d6119,#8fb32e,#ccff4d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
